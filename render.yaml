services:
  - type: web
    name: lua-obfuscator-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      # Shared secret between this bot and your Roblox executor worker.
      # Set a long random value, then use the SAME value in executor_worker.lua.
      - key: BRIDGE_KEY
        sync: false
    autoDeploy: true
