services:
  - type: web
    name: lua-obfuscator-bot
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y lua5.3
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
    autoDeploy: true
